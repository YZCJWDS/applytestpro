<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1100" width="800" height="1100" style="background:#ffffff; font-family: Arial, sans-serif;">
  <!-- Certificate Background Page -->
  <rect width="800" height="1100" fill="#ffffff" stroke="#cccccc" stroke-width="2" />
  
  <!-- Watermark Seal background -->
  <circle cx="580" cy="450" r="220" fill="none" stroke="#f0e6d2" stroke-width="2" opacity="0.6"/>
  <circle cx="580" cy="450" r="180" fill="none" stroke="#f0e6d2" stroke-width="1.5" opacity="0.6"/>
  <text x="580" y="450" text-anchor="middle" fill="#e6dbbf" font-size="28" font-weight="bold" opacity="0.5" transform="rotate(-30 580 450)">CANADA REVENUE AGENCY</text>

  <!-- Red Maple Leaf Logo -->
  <g transform="translate(60, 50) scale(1.4)">
    <path fill="#FF0000" d="M 12 0 L 15 7 L 22 4 L 19 12 L 27 15 L 21 21 L 23 29 L 16 26 L 14 36 L 10 36 L 8 26 L 1 29 L 3 21 L -3 15 L 5 12 L 2 4 L 9 7 Z"/>
  </g>

  <!-- Header Text -->
  <text x="120" y="72" fill="#000000" font-size="20" font-weight="bold">Canada Revenue Agency</text>
  <text x="355" y="72" fill="#000000" font-size="20" font-weight="bold">/ Agence du revenu du Canada</text>

  <text x="640" y="120" fill="#000000" font-size="14">Ottawa ON</text>
  <text x="640" y="140" fill="#000000" font-size="14">K1A 0L5</text>

  <text x="60" y="140" fill="#000000" font-size="14">March 12, 2025</text>
  <text x="60" y="160" fill="#000000" font-size="14">Levi Predovic</text>

  <text x="60" y="210" fill="#000000" font-size="14">Dear Predovic</text>

  <!-- Title -->
  <text x="400" y="260" text-anchor="middle" fill="#000000" font-size="18" font-weight="bold" letter-spacing="1">NOTIFICATION OF REGISTRATION</text>

  <text x="60" y="300" fill="#000000" font-size="14" font-weight="bold">Levi Predovic</text>

  <!-- Body Paragraphs -->
  <text x="60" y="330" fill="#222222" font-size="13">The charity's tax-exempt status has been granted under the provisions for registered charities.</text>
  <text x="60" y="350" fill="#222222" font-size="13">Organization: Organization for the recording, observation, and conservation of trees and other plants</text>
  <text x="60" y="370" fill="#222222" font-size="13">Official Jurisdiction: Northwest Territories (NT) &amp; Alberta Charitable Fund-raising Act.</text>

  <!-- Registration Number Section Box -->
  <rect x="60" y="410" width="680" height="70" fill="#f8f9fa" stroke="#dddddd" rx="4"/>
  <text x="80" y="440" fill="#000000" font-size="16" font-weight="bold">Registration Number: 107233456RR0001</text>
  <text x="80" y="465" fill="#000000" font-size="14" font-weight="bold">Effective Date of Registration: March 12, 2025</text>

  <!-- Continuation Paragraphs -->
  <text x="60" y="520" fill="#222222" font-size="13">The charity meets the operational requirements under charity registration regulations.</text>
  <text x="60" y="540" fill="#222222" font-size="13">Official records and tax-exempt status have been confirmed on the registry system.</text>
  <text x="60" y="580" fill="#222222" font-size="13">Registration ID 107233456RR0001 is active for official tax receipt issuance and public donation records.</text>

  <text x="60" y="640" fill="#222222" font-size="13">For further Charities registration information, please refer to official Directorate records.</text>

  <!-- Signoff -->
  <text x="60" y="700" fill="#000000" font-size="14">Yours sincerely,</text>

  <!-- Signature simulation line -->
  <path d="M 60 760 C 90 710, 130 790, 180 730 C 210 700, 240 760, 290 730" fill="none" stroke="#001a4d" stroke-width="2.5"/>

  <text x="60" y="790" fill="#000000" font-size="14" font-weight="bold">Director, Charities Directorate</text>
  <text x="60" y="810" fill="#555555" font-size="12">Canada Revenue Agency / Agence du revenu du Canada</text>

  <!-- Bottom Stamp / Official Seal -->
  <g transform="translate(680, 960)">
    <circle cx="0" cy="0" r="45" fill="none" stroke="#0033aa" stroke-width="2"/>
    <circle cx="0" cy="0" r="40" fill="none" stroke="#0033aa" stroke-width="1" stroke-dasharray="4,2"/>
    <text x="0" y="-10" text-anchor="middle" fill="#0033aa" font-size="9" font-weight="bold">CANADA REVENUE AGENCY</text>
    <text x="0" y="5" text-anchor="middle" fill="#0033aa" font-size="10" font-weight="bold">REGISTERED</text>
    <text x="0" y="18" text-anchor="middle" fill="#0033aa" font-size="8">CHARITIES DIRECTORATE</text>
  </g>
</svg>
